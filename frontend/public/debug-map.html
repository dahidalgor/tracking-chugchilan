<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Mapa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #222; color: #0f0; padding: 20px; }
        .log-container { background: #000; border: 1px solid #0f0; padding: 20px; border-radius: 5px; }
        .log-entry { margin: 5px 0; padding: 5px; border-left: 3px solid #0f0; padding-left: 10px; }
        .error { color: #f00; border-left-color: #f00; }
        .warning { color: #ff0; border-left-color: #ff0; }
        .success { color: #0f0; border-left-color: #0f0; }
        .info { color: #0ff; border-left-color: #0ff; }
        h1 { color: #0f0; margin-bottom: 20px; }
        .section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #0f0; }
        #mapContainer { margin-top: 20px; }
        #map { width: 100%; height: 400px; background: #333; border: 1px solid #0f0; border-radius: 5px; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>🔧 DEBUG - TRACKING QUILOTOA MAPA</h1>
    
    <div class="log-container">
        <div id="logs"></div>
    </div>

    <div class="section">
        <h2 style="color: #0ff;">Verificación de carga:</h2>
        <div id="checks"></div>
    </div>

    <div class="section">
        <h2 style="color: #0ff;">Contenedor del mapa:</h2>
        <div id="mapContainer">
            <div id="map"></div>
        </div>
        <div id="mapStatus"></div>
    </div>

    <script>
        // Sistema de logging en la página
        const logsDiv = document.getElementById('logs');
        const checksDiv = document.getElementById('checks');
        const mapStatusDiv = document.getElementById('mapStatus');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(entry);
            console.log(`[${type.toUpperCase()}] ${message}`);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function addCheck(label, result) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${result ? 'success' : 'error'}`;
            entry.textContent = `${result ? '✓' : '✗'} ${label}`;
            checksDiv.appendChild(entry);
        }

        // Inicio
        log('Iniciando debug de mapa...', 'info');

        // Verificar Leaflet
        addCheck('Leaflet disponible', typeof L !== 'undefined');
        
        // Verificar contenedor
        const mapEl = document.getElementById('map');
        addCheck('Elemento #map existe', !!mapEl);

        // Intentar inicializar el mapa
        log('Intentando crear instancia de Leaflet...', 'info');
        
        try {
            const map = L.map('map').setView([51.505, -0.09], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            
            log('✓ Mapa creado exitosamente', 'success');
            addCheck('Mapa Leaflet funcional', true);
            
            // Información del mapa
            const mapStatus = `
                <div class="log-entry success">
                    <strong>Estado del mapa:</strong><br>
                    - Zoom: ${map.getZoom()}<br>
                    - Centro: ${map.getCenter()}<br>
                    - Tamaño: ${mapEl.offsetWidth}px × ${mapEl.offsetHeight}px<br>
                    - Display: ${window.getComputedStyle(mapEl).display}
                </div>
            `;
            mapStatusDiv.innerHTML = mapStatus;
            
        } catch (error) {
            log(`✗ Error al crear mapa: ${error.message}`, 'error');
            addCheck('Mapa Leaflet funcional', false);
            mapStatusDiv.innerHTML = `<div class="log-entry error">Error: ${error.message}</div>`;
        }

        log('Debug completado', 'success');
    </script>
</body>
</html>
